================================================================================
THE LEAGUE — a browser game about running a university
Single standalone file: no external libraries, no network calls, no build step.
================================================================================

CALIBRATION HARNESS REPORT (generated headlessly before the UI was built)
Seeds: 1..500. Player: Greyfriars College (initial rank 4, worst).
Two worlds, each with its own scripted Naive/Sensible/Sharp players
(dev/strategies.js):
  market - the original economy: per-field fees and thresholds, no
           intake cap, overage penalty. Sharp prices the captive
           segment, farms the intake->teaching loop, forecasts offer
           yield from league position, rations admission once on top.
  scheme - the National Admissions Scheme: regulated flat fee,
           student-proposing deferred acceptance per field, declared
           quotas with a per-seat annual cost. Sharp dives its
           threshold for the rejection cascade, then under-reports
           capacity (the Sonmez manipulation) to farm intake calibre,
           then re-expands late.

‑‑ world: market ‑‑
strategy  | meanScore | rank1  rank2  rank3  rank4 | score=3 | score>=1 | score<=0 | bankrupt
naive     |      0.02 |   0.0%   0.0%   1.8%  98.2% |    0.0% |     1.8% |    98.2% |     0.0%
sensible  |      0.81 |   6.2%   5.4%  52.0%  36.4% |    6.2% |    63.6% |    36.4% |     4.2%
sharp     |      2.21 |  58.4%   6.2%  33.0%   2.4% |   58.4% |    97.6% |     2.4% |     2.4%

‑‑ world: scheme ‑‑
strategy  | meanScore | rank1  rank2  rank3  rank4 | score=3 | score>=1 | score<=0 | bankrupt
naive     |      0.08 |   1.0%   0.4%   3.8%  94.8% |    1.0% |     5.2% |    94.8% |    94.6%
sensible  |      0.66 |   8.4%  12.4%  16.2%  63.0% |    8.4% |    37.0% |    63.0% |     0.0%
sharp     |      2.68 |  74.2%  21.8%   1.4%   2.6% |   74.2% |    97.4% |     2.6% |     0.0%

Calibration targets, market world (all met; numbers identical to the
previous report - the scheme was added without touching the market path):
  - Sharp reaches score 3 (worst -> best) in a healthy share of seeds (~1/3+)
  - Sensible typically improves rank, rarely reaches the top
  - Naive stagnates or declines
  - Bankruptcy possible but rare under Sensible play

Scheme world, against the same targets:
  - Sharp 74% worst -> first: met.
  - Sensible rarely tops (8.4%): met. Improves in 37% of seeds, less
    often than the market's 64% - a documented structural property,
    not a bug: with no price competition, incumbents defend rank with
    quality investment (reaction functions in the AI personalities),
    which deters half-hearted challenges. The Scheme protects the
    competent; it does not promote them.
  - Naive declines terminally in ~95% of seeds: static play declares
    seats it never fills and pays the Regulator's rent until broke.
    The market kills by crowd; the Scheme kills by emptiness.
  - Bankruptcy under Sensible play: 0.0-0.2% (rare).

<style>

<script>
'use strict';
/* ============================================================================
 * THE LEAGUE — headless game engine
 * ----------------------------------------------------------------------------
 * Pure, deterministic (seeded) engine. No DOM, no Date, no Math.random.
 * Used verbatim by both the Node calibration harness and the browser UI.
 *
 * DOCUMENTED MODELLING CHOICES
 * ----------------------------
 * Applicant distribution (drawn jointly, per applicant):
 *   - school score s ~ Normal(sMean, sSd), clamped to [sClampLo, sClampHi].
 *   - budget b = bBase + bSlope*(s - sMean) + Normal(0, bNoise), clamped to
 *     [bMin, bMax]. bSlope > 0 gives the mild positive score/budget
 *     correlation required by the spec (richer students score a bit higher).
 *   - taste weight theta ~ Uniform(thetaMin, thetaMax); student values a
 *     university at T_f + theta * R_f for their preferred field f.
 *   - field preference: stratified, not Bernoulli — exactly
 *     Math.round(pStem * nApplicants) applicants prefer STEM each round,
 *     the rest HSS. Scores, budgets and theta stay iid; only the field
 *     composition is deterministic given pStem (see drift below).
 *
 * Field-preference drift (endogenous, from round 2 onward):
 *   pStem <- clamp(pStem + pStemEta * tanh((avgR_S - avgR_H) / pStemScale),
 *                  pStemMin, pStemMax)
 *   where avgR_S / avgR_H are the mean STEM / HSS research qualities across
 *   all four universities at the start of the round. Gentle (eta small) and
 *   bounded away from 0 and 1 by the clamp.
 *
 * Investment response: g(I) = gamma * sqrt(I)  (concave, diminishing returns).
 *
 * Quality dynamics (per field, applied at end of round):
 *   R' = delta * R + g(I_R)
 *   T' = delta * T + g(I_T) + kappa * (sbarDept - sMean)   [intake term only
 *        if the department admitted >= 1 student this round]
 *   Qualities are floored at 0.
 *
 * Random events (from round 1): each university, in index order, draws an
 * occurrence and a selection number at the very top of every round from a
 * SEPARATE seeded stream (rngE = makeRng(seed + '/events')) — events never
 * consume the main rng, so the applicant stream is unaffected by them.
 * With probability 1/3 an event from the weighted EVENTS table applies
 * immediately, before the round's league table is computed (the table
 * reflects the morning's news). Money losses never push E below 5: the
 * loss is truncated to max(0, E - 5) and the record flagged truncated.
 * Quality effects are floored at 0. Broke universities draw and discard
 * both numbers (stream stability), and receive no events.
 *
 * TWO WORLDS (params.world):
 *   'market' (default) — the original economy: per-field fees and
 *     thresholds, applicants apply where affordable, every acceptance must
 *     be honoured, intake above capacity pays the overage penalty.
 *   'scheme' — the National Admissions Scheme: fees are fixed by the
 *     regulator (schemeFee, one flat rate for everything), budgets are
 *     irrelevant (the Scheme is means-blind), and matriculation is decided
 *     by student-proposing deferred acceptance (Gale-Shapley), run
 *     independently per field. Each university declares a quota per
 *     department (0..capacity seats) and a threshold below which
 *     applicants are unacceptable; department preferences are by school
 *     score. DA never over-fills a quota, so there is no overage — the
 *     risk is inverted: every DECLARED seat costs seatCost per year,
 *     filled or not (C_t = seatCost * total declared seats). Ledger and
 *     bankruptcy rules are unchanged. In scheme reports, 'applied' counts
 *     distinct students who proposed to the department at any point of the
 *     match, 'offers' echoes the declared quota, and 'cutoff' is the
 *     lowest admitted score (null if none). Student preference ties are
 *     broken by tiny rng perturbations; the scheme consumes the main rng
 *     differently from the market, so the two worlds are separate
 *     reproducibility universes (same seed + same world => same game).
 *
 * Ledger (canonical): E_{t+1} = (E_t + F_t - C_t - I_t) * (1 + r).
 * Bankruptcy: if E_t + F_t - C_t < 0 after market clearing, the university is
 * broke. Player broke => game over immediately. Broke AI (documented choice:
 * the simple option): it stops admitting (makes no offers) and invests
 * nothing; its endowment is frozen where it fell and its qualities keep
 * decaying at delta.
 *
 * Final ranking: the league table computed AFTER round `rounds` quality
 * update (i.e. the table that would open round 21). This means round-20
 * investment still counts, avoiding a degenerate "hoard in the last round"
 * strategy. Score = initial rank - final rank.
 * ========================================================================= */

/* ----------------------------- Seeded RNG ------------------------------- */
function hashStringToInt(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function makeRng(seed) {
  let a = (typeof seed === 'string' ? hashStringToInt(seed) : (seed >>> 0)) || 1;
  return function rng() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rng) {
  let u = 0, v = 0;
  while (u === 0) u = rng();
  while (v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));

/* ----------------------------- Parameters ------------------------------- */
const DEFAULT_PARAMS = {
  world: 'market',      // 'market' | 'scheme' (see header comment)
  rounds: 20,
  nApplicants: 40,
  capacity: 8,          // per department per round, zero marginal cost
  cOver: 24,            // per-head overage penalty above capacity (market)
  schemeFee: 6.5,       // regulated flat fee, all fields (scheme)
  seatCost: 1.0,        // annual cost per DECLARED seat, filled or not (scheme)
  interest: 0.05,       // r: interest on funds unspent after investment
  delta: 0.85,          // quality decay factor
  gamma: 1.5,           // g(I) = gamma * sqrt(I)
  kappa: 0.14,          // intake-quality effect on teaching

  // Applicant score distribution
  sMean: 60, sSd: 13, sClampLo: 20, sClampHi: 100,
  // Budgets (mildly correlated with score via bSlope)
  bBase: 10, bSlope: 0.12, bNoise: 2.6, bMin: 3, bMax: 22,
  // Taste for research
  thetaMin: 0, thetaMax: 1.2,
  // STEM preference drift
  pStemStart: 0.5, pStemEta: 0.02, pStemScale: 10, pStemMin: 0.3, pStemMax: 0.7,

  // AI spending discipline (per-round investment budget caps)
  aiPrestigeCap: 32,  // prestige chaser's institutional plan ceiling
  aiCashHi: 16,       // cash cow's upkeep ceiling
  aiCashLo: 11,       // cash cow's upkeep floor (drawn from hoard)

  // Starting universities, ordered by index (initial league rank order).
  // Each has a native AI personality used whenever the player doesn't run it.
  unis: [
    { name: 'Harkness University',    personality: 'balanced', E: 120, RS: 31, TS: 30, RH: 28, TH: 29 },
    { name: 'Wexford Institute',      personality: 'prestige', E: 100, RS: 36, TS: 20, RH: 28, TH: 17 },
    { name: 'Millbrook Metropolitan', personality: 'cashcow',  E: 95,  RS: 18, TS: 24, RH: 16, TH: 25 },
    { name: 'Greyfriars College',     personality: 'cashcow',  E: 85,  RS: 13, TS: 16, RH: 11, TH: 15 },
  ],
};

const EVENTS_TOTAL_WEIGHT = EVENTS.reduce((a, e) => a + e.weight, 0);
function pickEvent(r) {
  let x = r * EVENTS_TOTAL_WEIGHT;
  for (const e of EVENTS) { x -= e.weight; if (x < 0) return e; }
  return EVENTS[EVENTS.length - 1];
}

/* -------------------- Scheme world: deferred acceptance -------------------
 * Student-proposing DA for one field. Students rank the four departments by
 * T_f + theta * R_f (ties broken by tiny rng perturbation); departments
 * rank acceptable students (s >= threshold) by school score and hold at
 * most their declared quota. Terminates in <= 4 proposals per student and
 * yields the student-optimal stable matching. */
function runDA(field, students, decisions, unis, rng) {
  const n = unis.length;
  const proposers = students.map(a => {
    const order = unis
      .map(u => ({ i: u.index, v: (field === 'S' ? u.TS + a.theta * u.RS : u.TH + a.theta * u.RH) + rng() * 1e-9 }))
      .sort((x, y) => y.v - x.v)
      .map(x => x.i);
    return { a, order, next: 0 };
  });
  const held = Array.from({ length: n }, () => []);
  const proposedTo = Array.from({ length: n }, () => new Set());
  const queue = proposers.slice();
  while (queue.length) {
    const p = queue.shift();
    if (p.next >= p.order.length) continue; // exhausted: unmatched, exits
    const idx = p.order[p.next++];
    proposedTo[idx].add(p);
    const d = decisions[idx];
    const q = d ? (field === 'S' ? d.qS : d.qH) : 0;
    const thr = d ? (field === 'S' ? d.thrS : d.thrH) : Infinity;
    if (!d || q <= 0 || p.a.s < thr) { queue.push(p); continue; } // rejected outright
    held[idx].push(p);
    if (held[idx].length > q) {
      held[idx].sort((x, y) => y.a.s - x.a.s);
      queue.push(held[idx].pop()); // displace the weakest held student
    }
  }
  return { held, proposedTo };
}

/* ------------------------- AI opponent heuristics ------------------------
 * All AIs obey the same rules as the player: same capacity, overage cost,
 * decay, investment technology; they see only the public league table, the
 * public cohort statistics, and their own private state/history. They never
 * see the player's current-round choices or the applicant realizations.
 *
 * Personality assignment: the three non-player universities, ordered by
 * initial league position (best first), get: Balanced Incumbent, Prestige
 * Chaser, Cash Cow.
 * ------------------------------------------------------------------------ */

// Maintenance investment that offsets decay for quality Q: g(I) = (1-d)Q.
function maintInvest(Q, P) {
  const need = (1 - P.delta) * Q / P.gamma;
  return need * need;
}

/* The Prestige Chaser: overweights research investment, high fees, high
 * thresholds. Adapts gradually: raises fees when demand is strong, trims
 * fees/thresholds when enrolment collapses. Exploitable: its high prices and
 * standards leave the low end of the market uncontested, and it habitually
 * underfunds teaching, so its student appeal erodes. */
function aiPrestige(P) {
  return {
    init(uni) {
      uni.ai = P.world === 'scheme'
        ? { q: { S: 5, H: 5 }, thr: { S: 66, H: 66 } }
        : { fee: { S: 12, H: 12 }, thr: { S: 64, H: 64 } };
    },
    // Scheme persona: small, selective, slow to unbend. Trims its standards
    // only when the hall is nearly empty; never grows beyond 6 seats.
    schemeAdmissions(uni) {
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          if (d.matric <= 1) { a.thr[f] -= 2; if (d.matric === 0) a.q[f] -= 1; }
          else if (d.matric === a.q[f]) { a.thr[f] += 1; if (d.applied > 2 * a.q[f]) a.q[f] += 1; }
          a.q[f] = clamp(a.q[f], 3, 6);
          a.thr[f] = clamp(a.thr[f], 56, 78);
        }
      }
      return { qS: a.q.S, thrS: a.thr.S, qH: a.q.H, thrH: a.thr.H };
    },
    admissions(uni) {
      if (P.world === 'scheme') return this.schemeAdmissions(uni);
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          if (d.matric > P.capacity) { a.fee[f] += 1.0; a.thr[f] += 1; }
          else if (d.matric >= 6) a.fee[f] += 0.5;
          else if (d.matric <= 1) { a.fee[f] -= 1.5; a.thr[f] -= 2; } // starving: correct hard
          else if (d.matric <= 3) { a.fee[f] -= 0.75; a.thr[f] -= 1; }
          else if (d.matric >= 4) a.thr[f] += 0.5; // creeping standards
        }
        a.fee[f] = clamp(a.fee[f], 8, 20);
        a.thr[f] = clamp(a.thr[f], 56, 78);
      }
      return { feeS: a.fee.S, thrS: a.thr.S, feeH: a.fee.H, thrH: a.thr.H };
    },
    // Spends aggressively, tying investment to income flow plus a draw on
    // savings; overweights research, but rescues teaching when its student
    // appeal is visibly collapsing (else it death-spirals).
    // Scheme only: prestige wounded in the published table opens the
    // war chest — quality is the only competition the Scheme permits.
    spend(uni, net, P2, rep) {
      const investable = Math.max(0, net - 15);
      const wounded = P2.world === 'scheme' && (uni.rank >= 3 || uni.gapBelow < 5);
      const drawE = wounded ? 0.25 : 0.15;
      const cap = wounded ? P2.aiPrestigeCap + 12 : P2.aiPrestigeCap;
      // Bounded ambition: even flush with cash it won't spend beyond its
      // institutional plan (~48/round) — the headroom a challenger needs.
      const budget = Math.min(investable, 1.2 * rep.F + drawE * Math.max(0, uni.E), cap);
      const teachShare = (uni.TS + uni.TH) < 0.75 * (uni.RS + uni.RH) ? 0.55 : 0.35;
      const tea = budget * teachShare, res = budget - tea;
      return { IRS: res / 2, IRH: res / 2, ITS: tea / 2, ITH: tea / 2 };
    },
  };
}

/* The Cash Cow: low fees, low thresholds, volume strategy, conservative
 * investment. Adapts: raises thresholds/fees when oversubscribed (overage is
 * expensive), lowers fees when halls are empty. Exploitable: chronic
 * underinvestment means its qualities decay, and its low fees can be
 * undercut for the budget segment. */
function aiCashCow(P) {
  return {
    init(uni) {
      uni.ai = P.world === 'scheme'
        ? { q: { S: P.capacity, H: P.capacity }, thr: { S: 35, H: 35 } }
        : { fee: { S: 6.5, H: 6.5 }, thr: { S: 45, H: 45 } };
    },
    // Scheme persona: every seat declared, every year, standards nominal.
    // Volume is the business model; the seats bill is the cost of doing it.
    schemeAdmissions(uni) {
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          if (d.matric < 6) a.thr[f] -= 2;
          else if (d.matric === a.q[f]) a.thr[f] += 1;
          a.thr[f] = clamp(a.thr[f], 30, 50);
        }
        a.q[f] = P.capacity;
      }
      return { qS: a.q.S, thrS: a.thr.S, qH: a.q.H, thrH: a.thr.H };
    },
    admissions(uni) {
      if (P.world === 'scheme') return this.schemeAdmissions(uni);
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          if (d.matric > P.capacity + 2) { a.thr[f] += 2; a.fee[f] += 0.5; }
          else if (d.matric > P.capacity) a.fee[f] += 0.5;
          else if (d.matric < 5) a.fee[f] -= 0.5;
          if (d.matric < 2) a.thr[f] -= 1.5;
        }
        a.fee[f] = clamp(a.fee[f], 5.5, 12);
        a.thr[f] = clamp(a.thr[f], 35, 60);
      }
      return { feeS: a.fee.S, thrS: a.thr.S, feeH: a.fee.H, thrH: a.thr.H };
    },
    // Truly conservative: a modest upkeep budget — 35% of fee income, with
    // a small floor drawn from its hoard when income dips and a hard cap of
    // 34 a round — evenly spread; profits are hoarded. Its qualities
    // therefore plateau in the high 80s — the exploitable seam.
    // Scheme only: with no price lever to defend its volume, a Cash Cow
    // that has been overtaken in the table fights back from the hoard.
    spend(uni, net, P2, rep) {
      const investable = Math.max(0, net - 15);
      const fight = P2.world === 'scheme' && (uni.rank >= 4 || uni.gapBelow < 4);
      const lo = fight ? P2.aiCashLo + 14 : P2.aiCashLo;
      const hi = fight ? P2.aiCashHi + 18 : P2.aiCashHi;
      const budget = Math.min(investable, Math.max(0.35 * rep.F, lo), hi);
      const each = budget / 4;
      return { IRS: each, ITS: each, IRH: each, ITH: each };
    },
  };
}

/* The Balanced Incumbent: maintains all four qualities against decay, then
 * spreads a share of the surplus; nudges each field's fee in whichever
 * direction improved that field's revenue last round (with safety overrides
 * for over/under-subscription). Exploitable: it defends but rarely grows, so
 * a compounding challenger can walk it down. */
function aiBalanced(P) {
  return {
    init(uni) {
      uni.ai = {
        fee: { S: 11, H: 11 }, thr: { S: 58, H: 58 },
        q: { S: 7, H: 7 },
        lastRev: { S: null, H: null }, lastDir: { S: 1, H: 1 },
        // "Roughly maintains all four qualities": steers each quality toward
        // a fixed target a shade above its starting level, rather than
        // compounding its endowment into unbounded growth. In the scheme,
        // with no price competition to manage, the incumbent runs a
        // slightly more ambitious plan.
        target: (m => ({ RS: uni.RS * m, TS: uni.TS * m, RH: uni.RH * m, TH: uni.TH * m }))(P.world === 'scheme' ? 1.06 : 1.02),
      };
    },
    // Scheme persona: prudent house-keeping — quotas track realized demand
    // (empty seats are money), standards drift with fill.
    schemeAdmissions(uni) {
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          if (d.matric <= a.q[f] - 3) { a.q[f] -= 1; a.thr[f] -= 1; }
          else if (d.matric <= a.q[f] - 2) a.thr[f] -= 1;
          else if (d.matric === a.q[f]) {
            a.thr[f] += 0.5;
            if (d.applied > 2 * a.q[f]) a.q[f] += 1;
          }
          a.q[f] = clamp(a.q[f], 4, P.capacity);
          a.thr[f] = clamp(a.thr[f], 50, 70);
        }
      }
      return { qS: a.q.S, thrS: a.thr.S, qH: a.q.H, thrH: a.thr.H };
    },
    admissions(uni) {
      if (P.world === 'scheme') return this.schemeAdmissions(uni);
      const a = uni.ai, last = uni.lastReport;
      for (const f of ['S', 'H']) {
        if (last) {
          const d = last[f];
          const rev = d.income - d.overage;
          if (a.lastRev[f] !== null) {
            if (rev < a.lastRev[f]) a.lastDir[f] = -a.lastDir[f];
          }
          a.lastRev[f] = rev;
          a.fee[f] += 0.5 * a.lastDir[f];
          if (d.matric > P.capacity) { a.fee[f] += 0.5; a.thr[f] += 1; }
          else if (d.matric < 3) { a.fee[f] -= 1.0; a.thr[f] -= 1; }
          else if (d.matric >= 6) a.thr[f] += 0.5;
        }
        a.fee[f] = clamp(a.fee[f], 6, 16);
        a.thr[f] = clamp(a.thr[f], 50, 70);
      }
      return { feeS: a.fee.S, thrS: a.thr.S, feeH: a.fee.H, thrH: a.thr.H };
    },
    // Invest exactly enough to steer each quality toward its fixed target
    // (delta*Q + g(I) = target  =>  I = ((target - delta*Q)/gamma)^2),
    // scaled down if funds are short. Surplus endowment simply sits at
    // interest — the complacency a sharp challenger can exploit.
    spend(uni, net, P2) {
      const avail = Math.max(0, net - 20);
      let tgt = uni.ai.target;
      // Scheme only: an incumbent knocked off the top of the table defends
      // it from the hoard — the plan becomes 15% more ambitious until the
      // natural order is restored.
      if (P2.world === 'scheme' && (uni.rank >= 2 || uni.gapBelow < 10)) {
        tgt = { RS: tgt.RS * 1.15, TS: tgt.TS * 1.15, RH: tgt.RH * 1.15, TH: tgt.TH * 1.15 };
      }
      const toward = (Q, T) => {
        const need = (T - P2.delta * Q) / P2.gamma;
        return need > 0 ? need * need : 0;
      };
      const want = {
        IRS: toward(uni.RS, tgt.RS), ITS: toward(uni.TS, tgt.TS),
        IRH: toward(uni.RH, tgt.RH), ITH: toward(uni.TH, tgt.TH),
      };
      const tot = want.IRS + want.ITS + want.IRH + want.ITH;
      if (tot > avail && tot > 0) {
        const k = avail / tot;
        for (const q in want) want[q] *= k;
      }
      return want;
    },
  };
}

const AI_FACTORIES = { balanced: aiBalanced, prestige: aiPrestige, cashcow: aiCashCow };

/* ------------------------------ Game class ------------------------------ */
class Game {
  /**
   * opts: { seed, playerIndex (default 3), params (partial override) }
   */
  constructor(opts = {}) {
    const P = this.P = Object.assign({}, DEFAULT_PARAMS, opts.params || {});
    if (opts.params && opts.params.unis) P.unis = opts.params.unis;
    this.seed = opts.seed === undefined ? 1 : opts.seed;
    this.rng = makeRng(this.seed);
    // Separate event stream: events never consume the main rng.
    this.rngE = makeRng(String(this.seed) + '/events');
    this.playerIndex = opts.playerIndex === undefined ? 3 : opts.playerIndex;

    this.unis = P.unis.map((u, i) => ({
      index: i, name: u.name,
      E: u.E, RS: u.RS, TS: u.TS, RH: u.RH, TH: u.TH,
      broke: false, lastReport: null, ai: null, controller: null,
    }));

    // Every university the player doesn't govern runs its native personality.
    for (const uni of this.unis) {
      if (uni.index === this.playerIndex) continue;
      const kind = P.unis[uni.index].personality;
      uni.controller = AI_FACTORIES[kind](P);
      uni.personality = kind;
      uni.controller.init(uni);
    }

    this.round = 0;
    this.pStem = P.pStemStart;
    this.phase = 'pre'; // pre -> admissions -> spend -> (admissions|over|bankrupt)
    this.initialRank = this.rankOf(this.playerIndex);
    this.rankHistory = [this.initialRank]; // rank at start of each round; last entry = final
    this.roundLog = [];
    this.applicants = null;
    this._reports = null;
  }

  /* League table: rank by descending quality sum; ties by endowment (higher
   * first), then by fixed index. Endowments are NOT exposed in the table. */
  leagueTable() {
    const rows = this.unis.map(u => ({
      index: u.index, name: u.name,
      RS: u.RS, TS: u.TS, RH: u.RH, TH: u.TH,
      total: u.RS + u.TS + u.RH + u.TH,
      broke: u.broke,
      _E: u.E,
    }));
    rows.sort((a, b) => (b.total - a.total) || (b._E - a._E) || (a.index - b.index));
    rows.forEach((r, i) => { r.rank = i + 1; delete r._E; });
    return rows;
  }
  rankOf(idx) { return this.leagueTable().find(r => r.index === idx).rank; }

  /* Begin a round: update field-preference drift, draw the fresh cohort,
   * publish the league table and cohort statistics. */
  startRound() {
    if (this.phase !== 'pre' && this.phase !== 'between') throw new Error('bad phase ' + this.phase);
    const P = this.P;
    this.round++;
    // The morning's news: events fire before the pStem update and before
    // the league table is computed, so the year's table reflects them.
    // Every university draws two numbers (occurrence, selection) from the
    // event stream in index order, even when unused — stream stability.
    const events = [];
    for (const u of this.unis) {
      const rOcc = this.rngE(), rSel = this.rngE();
      if (u.broke) continue; // draws discarded
      if (rOcc < 1 / 3) {
        const ev = pickEvent(rSel);
        const rec = { index: u.index, id: ev.id };
        if (ev.kind === 'money') {
          let d = ev.deltaE;
          if (d < 0 && -d > Math.max(0, u.E - 5)) {
            d = -Math.max(0, u.E - 5); // a loss may never push E below 5
            rec.truncated = true;
          }
          u.E += d;
          rec.deltaE = d;
        } else {
          rec.deltaQ = {};
          rec.fields = Object.keys(ev.effects);
          for (const q of rec.fields) {
            u[q] = Math.max(0, u[q] + ev.effects[q]);
            rec.deltaQ[q] = ev.effects[q];
          }
        }
        events.push(rec);
      }
    }
    this.events = events;
    if (this.round >= 2) {
      let rs = 0, rh = 0;
      for (const u of this.unis) { rs += u.RS; rh += u.RH; }
      this.pStem = clamp(
        this.pStem + P.pStemEta * Math.tanh((rs / 4 - rh / 4) / P.pStemScale),
        P.pStemMin, P.pStemMax);
    }
    // Draw 40 fresh applicants (students last exactly one round). Field
    // assignment is stratified: exactly round(pStem * n) prefer STEM.
    const apps = [];
    const nStem = Math.round(this.pStem * P.nApplicants);
    for (let i = 0; i < P.nApplicants; i++) {
      const s = clamp(P.sMean + P.sSd * gauss(this.rng), P.sClampLo, P.sClampHi);
      const b = clamp(P.bBase + P.bSlope * (s - P.sMean) + P.bNoise * gauss(this.rng), P.bMin, P.bMax);
      const theta = P.thetaMin + (P.thetaMax - P.thetaMin) * this.rng();
      const f = i < nStem ? 'S' : 'H';
      apps.push({ s, b, theta, f });
    }
    this.applicants = apps;
    const scores = apps.map(a => a.s).sort((x, y) => x - y);
    const n = scores.length;
    const median = n % 2 ? scores[(n - 1) / 2] : (scores[n / 2 - 1] + scores[n / 2]) / 2;
    const mean = scores.reduce((a, b) => a + b, 0) / n;
    const pctStem = 100 * apps.filter(a => a.f === 'S').length / n;
    this.cohortStats = { median, mean, pctStem };
    const table = this.leagueTable();
    // Each university knows its own published rank and the gap to the
    // college directly below it (both public information).
    for (const row of table) {
      const u = this.unis[row.index];
      u.rank = row.rank;
      const below = table.find(r => r.rank === row.rank + 1);
      u.gapBelow = below ? row.total - below.total : Infinity;
    }
    if (this.round > 1) this.rankHistory.push(table.find(r => r.index === this.playerIndex).rank);
    this.phase = 'admissions';
    return { round: this.round, table, cohortStats: this.cohortStats, events };
  }

  /* Step 1 — Admissions. The player's {feeS, thrS, feeH, thrH} plus each
   * AI's simultaneous choice; then automatic market clearing. */
  submitAdmissions(playerDec) {
    if (this.phase !== 'admissions') throw new Error('bad phase ' + this.phase);
    const P = this.P;
    const scheme = P.world === 'scheme';
    const decisions = new Array(this.unis.length);
    for (const u of this.unis) {
      if (u.broke) { decisions[u.index] = null; continue; } // broke: stops admitting
      decisions[u.index] = (u.index === this.playerIndex)
        ? (scheme
            ? {
                qS: clamp(Math.round(+playerDec.qS || 0), 0, P.capacity), thrS: +playerDec.thrS || 0,
                qH: clamp(Math.round(+playerDec.qH || 0), 0, P.capacity), thrH: +playerDec.thrH || 0,
              }
            : {
                feeS: Math.max(0, +playerDec.feeS || 0), thrS: +playerDec.thrS || 0,
                feeH: Math.max(0, +playerDec.feeH || 0), thrH: +playerDec.thrH || 0,
              })
        : u.controller.admissions(u);
    }
    this._decisions = decisions;

    const reports = this.unis.map(() => ({
      S: { applied: 0, offers: 0, matric: 0, income: 0, overage: 0, sSum: 0, sbar: null },
      H: { applied: 0, offers: 0, matric: 0, income: 0, overage: 0, sSum: 0, sbar: null },
    }));

    if (scheme) {
      // National Admissions Scheme: per-field deferred acceptance. Fees are
      // the regulated flat rate; the per-field 'overage' slot carries the
      // seats bill (seatCost x declared quota, filled or not), so the
      // ledger and bankruptcy code below are identical across worlds.
      for (const f of ['S', 'H']) {
        const students = this.applicants.filter(a => a.f === f);
        const { held, proposedTo } = runDA(f, students, decisions, this.unis, this.rng);
        for (const u of this.unis) {
          const r = reports[u.index][f];
          const d = decisions[u.index];
          const q = d ? (f === 'S' ? d.qS : d.qH) : 0;
          r.applied = proposedTo[u.index].size;
          r.offers = q; // declared quota
          r.matric = held[u.index].length;
          r.income = r.matric * P.schemeFee;
          r.overage = q * P.seatCost; // the seats bill
          for (const p of held[u.index]) r.sSum += p.a.s;
          r.cutoff = r.matric > 0 ? Math.min(...held[u.index].map(p => p.a.s)) : null;
        }
      }
    } else {
      // Market clearing.
      for (const a of this.applicants) {
      const f = a.f;
      const offers = [];
      for (const u of this.unis) {
        const d = decisions[u.index];
        if (!d) continue;
        const fee = f === 'S' ? d.feeS : d.feeH;
        const thr = f === 'S' ? d.thrS : d.thrH;
        if (fee <= a.b) {
          reports[u.index][f].applied++;
          if (a.s >= thr) { reports[u.index][f].offers++; offers.push(u); }
        }
      }
      if (!offers.length) continue; // exits, no consequence
      let best = [], bestV = -Infinity;
      for (const u of offers) {
        const v = (f === 'S' ? u.TS + a.theta * u.RS : u.TH + a.theta * u.RH);
        if (v > bestV + 1e-12) { bestV = v; best = [u]; }
        else if (Math.abs(v - bestV) <= 1e-12) best.push(u);
      }
      const chosen = best[Math.floor(this.rng() * best.length)];
      const r = reports[chosen.index][f];
      r.matric++;
      r.sSum += a.s;
      r.income += (f === 'S' ? decisions[chosen.index].feeS : decisions[chosen.index].feeH);
      }
    }
    for (const u of this.unis) {
      for (const f of ['S', 'H']) {
        const r = reports[u.index][f];
        if (!scheme) r.overage = Math.max(0, r.matric - P.capacity) * P.cOver;
        r.sbar = r.matric > 0 ? r.sSum / r.matric : null;
        delete r.sSum;
      }
      const rep = reports[u.index];
      rep.F = rep.S.income + rep.H.income;
      rep.C = rep.S.overage + rep.H.overage;
      rep.net = u.E + rep.F - rep.C; // funds available for investment
    }
    this._reports = reports;

    // Bankruptcy check (after clearing, before spending).
    for (const u of this.unis) {
      if (!u.broke && reports[u.index].net < 0) {
        u.broke = true;
        // Broke AI: endowment frozen where it fell; stops admitting; invests 0.
        u.E = reports[u.index].net;
        if (u.index === this.playerIndex) {
          this.phase = 'bankrupt';
          this.finalRank = this.rankOf(this.playerIndex);
          this.score = this.initialRank - this.finalRank;
          this.bankrupt = true;
        }
      }
    }
    const playerRep = reports[this.playerIndex];
    if (this.phase !== 'bankrupt') this.phase = 'spend';
    return {
      bankrupt: this.phase === 'bankrupt',
      S: playerRep.S, H: playerRep.H,
      F: playerRep.F, C: playerRep.C, net: playerRep.net,
    };
  }

  /* Step 2 — Spending. Player investments {IRS, ITS, IRH, ITH}; AIs choose
   * theirs from their own report; then the canonical ledger + quality
   * dynamics are applied to everyone. */
  submitSpend(playerInv) {
    if (this.phase !== 'spend') throw new Error('bad phase ' + this.phase);
    const P = this.P;
    for (const u of this.unis) {
      const rep = this._reports[u.index];
      let inv;
      if (u.broke) {
        inv = { IRS: 0, ITS: 0, IRH: 0, ITH: 0 };
      } else if (u.index === this.playerIndex) {
        inv = {
          IRS: Math.max(0, +playerInv.IRS || 0), ITS: Math.max(0, +playerInv.ITS || 0),
          IRH: Math.max(0, +playerInv.IRH || 0), ITH: Math.max(0, +playerInv.ITH || 0),
        };
      } else {
        inv = u.controller.spend(u, rep.net, P, rep);
        for (const k of ['IRS', 'ITS', 'IRH', 'ITH']) inv[k] = Math.max(0, inv[k] || 0);
      }
      // Total investment cannot exceed available funds; scale down if over.
      let tot = inv.IRS + inv.ITS + inv.IRH + inv.ITH;
      const avail = Math.max(0, rep.net);
      if (tot > avail) {
        const k = tot > 0 ? avail / tot : 0;
        for (const q in inv) inv[q] *= k;
        tot = avail;
      }
      // Canonical ledger. Broke unis keep their frozen (negative) endowment.
      if (!u.broke) u.E = (rep.net - tot) * (1 + P.interest);
      // Quality dynamics (investment effects materialize "next round": they
      // enter the state that the next league table is computed from).
      const g = I => P.gamma * Math.sqrt(I);
      u.RS = Math.max(0, P.delta * u.RS + g(inv.IRS));
      u.RH = Math.max(0, P.delta * u.RH + g(inv.IRH));
      let ts = P.delta * u.TS + g(inv.ITS);
      let th = P.delta * u.TH + g(inv.ITH);
      if (rep.S.matric > 0) ts += P.kappa * (rep.S.sbar - P.sMean);
      if (rep.H.matric > 0) th += P.kappa * (rep.H.sbar - P.sMean);
      u.TS = Math.max(0, ts);
      u.TH = Math.max(0, th);
      u.lastReport = rep;
      u._lastInv = inv;
    }
    const pRep = this._reports[this.playerIndex];
    const pInv = this.unis[this.playerIndex]._lastInv;
    const spent = pInv.IRS + pInv.ITS + pInv.IRH + pInv.ITH;
    this.roundLog.push({
      round: this.round, report: pRep, invested: spent,
      E_end: this.unis[this.playerIndex].E,
    });
    if (this.round >= P.rounds) {
      this.phase = 'over';
      const finalTable = this.leagueTable();
      this.finalRank = finalTable.find(r => r.index === this.playerIndex).rank;
      this.rankHistory.push(this.finalRank);
      this.score = this.initialRank - this.finalRank;
      return { done: true, finalTable, finalRank: this.finalRank, score: this.score };
    }
    this.phase = 'between';
    return { done: false };
  }
}

        <td class="num">${n1(r.RH)}${dg('RH')}</td><td class="num">${n1(r.TH)}${dg('TH')}</td>
        <td class="num total">${n1(r.total)}</td>
        <td>${delta}</td>
      </tr>`;
    }).join('');
    return `<div class="scrollx"><table class="league">
      ${opts.caption ? `<caption>${opts.caption}</caption>` : ''}
      <thead><tr><th>#</th><th>Institution</th><th>R<sub>S</sub></th><th>T<sub>S</sub></th><th>R<sub>H</sub></th><th>T<sub>H</sub></th><th>Total</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="tbl-foot">Research (R) and Teaching (T) quality by field, as assessed by the Ledger. Rank by total; ties broken by matters the Ledger does not discuss.${opts.daggers ? ' <sup class="dag">&dagger;</sup>&nbsp;revised overnight; see the morning&rsquo;s extra.' : ''}</div>`;
  }

  /* --------------------------- title screen ---------------------------- */
  function renderTitle() {
    const probe = new Game({ seed: 1 });
    const table = probe.leagueTable();
    prevRanks = null;
    const rows = table.map(r => {
      const maxScore = r.rank - 1;
      const featured = r.rank === 4;
      return `<div class="row ${featured ? 'featured' : ''}">
        <div class="rank num">${r.rank}</div>
        <div class="uni">
          <b>${esc(r.name)}</b>
          <div class="epithet">${EPITHETS[r.index]}</div>
          <div class="scores num">R/T (STEM) ${n1(r.RS)} / ${n1(r.TS)} &middot; R/T (HSS) ${n1(r.RH)} / ${n1(r.TH)} &middot; total ${n1(r.total)}</div>
        </div>
        <div class="pick">
          <button class="btn-ghost pick-btn" data-idx="${r.index}">${featured ? 'Take the post' : 'Govern'}</button>
          <span class="maxnote">max score ${maxScore}</span>
        </div>
      </div>`;
    }).join('');

    setView(`
      ${masthead('A game of university governance, in twenty academic years')}
      <div class="leader">
        <p class="dropcap">Each autumn this newspaper publishes its League of the four universities, and each autumn the same names appear in the same order. The Ledger regards this as proof of the natural order of things.</p>
        <p>At the foot of the table stands <b>Greyfriars College</b> — endowment thin, faculties tired, reputation a rumour. Its governing board, out of options and nearly out of money, is hiring anyone willing to serve as Vice-Chancellor. The Ledger doubts anything can be done. Proving the Ledger wrong is the whole game: take the worst chair in academia and carry it to the top of the table.</p>
        <p>Vacancies exist at better houses, for those who prefer a quieter life. The scoring, note, is unsentimental: your score is how many places you climb. Start high and there is nowhere to go.</p>
      </div>
      <div class="editions">
        <button class="edition ${chosenWorld === 'market' ? 'on' : ''}" data-w="market">
          <b>The Open Market</b>
          <span>Set your own fees, take everyone who accepts. Applicants go where they can afford; over-offering is the classic way to die.</span>
        </button>
        <button class="edition ${chosenWorld === 'scheme' ? 'on' : ''}" data-w="scheme">
          <b>The National Admissions Scheme</b>
          <span>Fees fixed by the Regulator at ${money(P.schemeFee)} a head. A central match assigns students; you declare seats and standards. Every declared seat costs ${money(P.seatCost)} a year, filled or not.</span>
        </button>
      </div>
      <div class="prospect">${rows}</div>
      <details class="rules">
        <summary>How the game is played &mdash; the standing rules</summary>
        <div class="card-body">
          <ul>
            <li><b>Two editions.</b> In <b>the Open Market</b> the rules below apply as written. In <b>the National Admissions Scheme</b>, fees are fixed by the Regulator at ${money(P.schemeFee)} for everyone and means do not matter; instead of making offers you declare <b>seats</b> (0&ndash;${P.capacity} per department) and a threshold, a central algorithm (deferred acceptance) assigns each student to the best-ranked place that will hold them, quotas are never exceeded &mdash; and every declared seat costs <b>${money(P.seatCost)}</b> a year, filled or not. The Market kills by crowd; the Scheme kills by emptiness.</li>
            <li><b>Each year, two decisions.</b> First the <b>Admissions Desk</b>: for each field (STEM and HSS) you set an entry <b>threshold</b> (every applicant at or above it receives an offer) and a <b>fee</b>. Then the <b>Bursar&rsquo;s Office</b>: you invest in research and teaching quality, per field.</li>
            <li><b>Applicants.</b> Forty fresh school-leavers apply each year. Each has a school score, a preferred field, a taste for research prestige, and a private budget. They apply everywhere they can afford, and enrol wherever their offers look best (teaching quality plus their personal weight on research). They stay one year, pay one fee, and leave.</li>
            <li><b>Capacity.</b> Each department teaches up to <b>8</b> students at no extra cost. You must take everyone who accepts your offer; each student beyond 8 costs <b>${money(P.cOver)}</b> in emergency provision. Over-offering is the classic way to die.</li>
            <li><b>Money.</b> Fees are paid up front &mdash; the year&rsquo;s income sits in the endowment before the Bursar spends a penny, and whatever he does not spend earns ${Math.round(P.interest * 100)}% interest, fees included. If your endowment cannot cover the year's overage bill, the College is bankrupt and the game ends.</li>
            <li><b>Quality.</b> Investment raises quality with diminishing returns, and takes effect the following year. All quality decays ${Math.round((1 - P.delta) * 100)}% a year if unattended. Teaching quality also drifts with the calibre of the students you actually admit, relative to the national average of ${P.sMean}.</li>
            <li><b>Fashion.</b> Field preferences drift slowly toward whichever field boasts higher research quality across the sector.</li>
            <li><b>Information.</b> The League table is public. Rivals&rsquo; fees, thresholds, enrolments and endowments are not. The Ledger publishes no figures on family means &mdash; though a shrewd reader may suspect that money and marks travel together, and your own books reveal, year by year, who could afford you.</li>
            <li><b>The end.</b> After ${P.rounds} years the final League is printed. Score = starting rank &minus; final rank.</li>
          </ul>
        </div>
      </details>
      <div class="footer-note">The Morning Ledger University Guide &middot; entirely fictional &middot; one file</div>
      <div class="footer-note sig"><a href="https://steffenhuck.github.io">steffen huck</a></div>
    `);
    els('.edition').forEach(b => b.addEventListener('click', () => {
      chosenWorld = b.dataset.w;
      els('.edition').forEach(x => x.classList.toggle('on', x === b));
    }));
    els('.pick-btn').forEach(b => b.addEventListener('click', () => {
      const idx = +b.dataset.idx;
      // Optional ?seed= query parameter makes a season reproducible;
      // otherwise each season is random. The seed in play is printed in
      // the footer either way.
      const seedRaw = new URLSearchParams(location.search).get('seed');
      const seed = seedRaw === null || seedRaw.trim() === ''
        ? ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0)
        : (parseInt(seedRaw, 10) >>> 0 || 1);
      startGame(idx, seed);
    }));
  }

  // Opening admissions defaults per college — roughly each house's native
  // AI opening, so year 1 isn't a guaranteed empty hall. (With the old flat
  // fee 8 / threshold 55, the bottom college enrolled nobody in year 1 in
  // 100% of 200 test seeds: every offer was dominated by Millbrook.)
  const OPENING = {
    market: [
      { fee: 11,  thr: 58 },  // Harkness
      { fee: 12,  thr: 62 },  // Wexford
      { fee: 6.5, thr: 45 },  // Millbrook
      { fee: 5.5, thr: 35 },  // Greyfriars
    ],
    scheme: [
      { q: 7, thr: 58 },      // Harkness
      { q: 5, thr: 66 },      // Wexford
      { q: 8, thr: 35 },      // Millbrook
      { q: 6, thr: 35 },      // Greyfriars
    ],
  };

  function startGame(idx, seed) {
    game = new Game({ seed, playerIndex: idx, params: { world: chosenWorld } });
    prevRanks = null;
    const o = OPENING[chosenWorld][idx];
    dec = chosenWorld === 'scheme'
      ? { qS: o.q, thrS: o.thr, qH: o.q, thrH: o.thr }
      : { feeS: o.fee, thrS: o.thr, feeH: o.fee, thrH: o.thr };
    nextYear();
  }

  function nextYear() {
    pre = game.startRound();
    rep = null;
    buildNews();
    renderAdmissions();
    if (newsData.length) showExtra(); // desk is already rendered beneath
  }

  /* ------------------------- my college card --------------------------- */

        <tbody>
          <tr><td>STEM</td><td class="num">${last.S.applied}</td><td class="num">${last.S.offers}</td><td class="num">${last.S.matric}</td><td class="num">${last.S.sbar === null ? '&mdash;' : n1(last.S.sbar)}</td></tr>
          <tr><td>HSS</td><td class="num">${last.H.applied}</td><td class="num">${last.H.offers}</td><td class="num">${last.H.matric}</td><td class="num">${last.H.sbar === null ? '&mdash;' : n1(last.H.sbar)}</td></tr>

          <div class="qrow"><span class="lbl"><span>Teaching &middot; STEM</span><b class="num">${n1(u.TS)}</b></span>${bar(u.TS, '')}</div>

        </div>

  function cohortCard() {
    const c = pre.cohortStats;
    return `<section class="card plain">
      <div class="card-head"><span>This year&rsquo;s applicants</span><span class="kicker">${P.nApplicants} school-leavers</span></div>
      <div class="card-body">
        <div class="statline">
          <div class="stat"><span class="lbl">Median score</span><span class="val num">${n1(c.median)}</span></div>
          <div class="stat"><span class="lbl">Mean score</span><span class="val num">${n1(c.mean)}</span></div>

        </div>
        <div class="notice">${pick([
          'The Ledger publishes no figures on family means &mdash; though money and marks are rumoured to travel together, and your own books show, year by year, who could afford you.',
          'On applicants&rsquo; means the Ledger is silent, as is proper &mdash; but marks and money keep close company, and your own registry remembers who could afford you last year.',
        ])}</div>
      </div>
    </section>`;

  /* --------------------------- admissions ------------------------------ */
  // Quality cells revised by this morning's events, for the dagger marks.
  function morningDaggers() {
    const map = {};
    for (const ev of (pre.events || [])) {
      if (ev.deltaQ) map[ev.index] = new Set(Object.keys(ev.deltaQ));
    }
    return Object.keys(map).length ? map : null;
  }

  function renderAdmissions() {
    const u = game.unis[game.playerIndex];
    const scheme = inScheme();
    const fieldBox = f => {
      const last = u.lastReport ? u.lastReport[f] : null;
      const secondCtl = scheme
        ? `<div class="ctl">
            <span class="lbl">Seats declared (${money(P.seatCost)} each, filled or not)</span>
            <div class="stepper" data-kind="q" data-f="${f}">
              <button data-d="-8">&#171;</button><button data-d="-1">&minus;</button>
              <span class="val num" id="q${f}">${dec['q' + f]}</span>
              <button data-d="1">+</button><button data-d="8">&#187;</button>
            </div>
          </div>
          <div class="feefixed">Fee: set by the Regulator at ${money(P.schemeFee)} a head.</div>`
        : `<div class="ctl">
            <span class="lbl">Annual fee</span>
            <div class="stepper" data-kind="fee" data-f="${f}">
              <button data-d="-2">&#171;</button><button data-d="-0.5">&minus;</button>
              <span class="val num" id="fee${f}">${money(dec['fee' + f])}</span>
              <button data-d="0.5">+</button><button data-d="2">&#187;</button>
            </div>
          </div>`;
      const demand = last
        ? (scheme
            ? `Last year: <b class="num">${last.applied}</b> proposed &middot; placed <b class="num">${last.matric}</b> of <b class="num">${last.offers}</b> seats${last.cutoff != null ? ` &middot; cutoff <b class="num">${n1(last.cutoff)}</b>` : ''}${last.matric < last.offers ? ` <b class="red">(${last.offers - last.matric} empty)</b>` : ''}`
            : `Last year: <b class="num">${last.applied}</b> applied &middot; <b class="num">${last.offers}</b> offers out &middot; <b class="num">${last.matric}</b> enrolled${last.matric > P.capacity ? ` <b class="red">(${last.matric - P.capacity} over capacity)</b>` : ''}`)
        : 'No demand history yet.';
      return `<div class="fieldbox">
        <h4>${FIELD_NAME[f]}</h4>
        <div class="ctl">
          <span class="lbl">Entry threshold (school score)</span>
          <div class="stepper" data-kind="thr" data-f="${f}">
            <button data-d="-5">&#171;</button><button data-d="-1">&minus;</button>
            <span class="val num" id="thr${f}">${dec['thr' + f]}</span>
            <button data-d="1">+</button><button data-d="5">&#187;</button>
          </div>
        </div>
        ${secondCtl}
        <div class="demandline">${demand}</div>
      </div>`;
    };
    setView(`
      ${masthead('Published every autumn by The Morning Ledger', true)}
      ${dateline()}
      ${phaseStrip(1)}
      ${newsCard()}
      <div class="cols">
        <div class="stack">
          <section class="card plain">
            <div class="card-head"><span>The League</span><span class="kicker">Year ${game.round}</span></div>
            <div class="card-body">${leagueTableHtml(pre.table, { daggers: morningDaggers() })}</div>
          </section>
          ${cohortCard()}
        </div>
        <div class="stack">
          <section class="card admissions">
            <div class="card-head"><span>Step I &mdash; The Admissions Desk</span><span class="kicker">${scheme ? 'seats &amp; standards' : 'offers &amp; fees'}</span></div>
            <div class="card-body">
              <div class="fields">${fieldBox('S')}${fieldBox('H')}</div>
              <div class="notice warn">${scheme
                ? `The Scheme&rsquo;s algorithm assigns each student to the best-ranked department that will hold them; your quota is never exceeded. But the Regulator&rsquo;s rent applies to every declared seat &mdash; ${money(P.seatCost)} a year, filled or not. Empty seats are pure loss.`
                : `Capacity is ${P.capacity} per department. Every offer that is accepted must be honoured; each enrolee beyond ${P.capacity} costs ${money(P.cOver)}. Applicants who can afford you and clear your threshold get an offer &mdash; all of them.`}</div>
              <button class="btn oxblood" id="post">${scheme ? 'File the return with the Scheme' : 'Post the prospectus &amp; make offers'}</button>
            </div>
          </section>
          ${myCard()}
        </div>
      </div>
      <div class="footer-note">Printed under licence &numero; ${game.seed} &middot; The Morning Ledger University Guide</div>
    `);
    els('.stepper button').forEach(b => b.addEventListener('click', () => {
      const box = b.closest('.stepper');
      const f = box.dataset.f, d = parseFloat(b.dataset.d);
      if (box.dataset.kind === 'thr') {
        dec['thr' + f] = Math.max(20, Math.min(100, dec['thr' + f] + d));
        el('#thr' + f).textContent = dec['thr' + f];
      } else if (box.dataset.kind === 'q') {
        dec['q' + f] = Math.max(0, Math.min(P.capacity, Math.round(dec['q' + f] + d)));
        el('#q' + f).textContent = dec['q' + f];
      } else {
        dec['fee' + f] = Math.max(0, Math.min(20, Math.round((dec['fee' + f] + d) * 2) / 2));
        el('#fee' + f).textContent = money(dec['fee' + f]);
      }
    }));
    el('#post').addEventListener('click', () => {
      rep = game.submitAdmissions(dec);
      if (game.phase === 'bankrupt') renderEnd({ bankrupt: true });
      else renderBursar();
    });
    el('#resign').addEventListener('click', resign);
  }

  /* ----------------------------- bursar -------------------------------- */
  function renderBursar() {
    const u = game.unis[game.playerIndex];
    const budget = Math.max(0, rep.net);
    inv = { IRS: 0, ITS: 0, IRH: 0, ITH: 0 };

    const reportRow = (f) => {
      const d = rep[f];
      return `<tr>
        <td>${FIELD_SHORT[f]}</td>
        <td class="num">${d.applied}</td><td class="num">${d.offers}</td><td class="num">${d.matric}</td>
        <td class="num">${d.sbar === null ? '&mdash;' : n1(d.sbar)}</td>
        <td class="num">${money(d.income)}</td>
        <td class="num ${d.overage ? 'red' : ''}">${d.overage ? '&minus;' + money(d.overage) : '&mdash;'}</td>
      </tr>`;
    };

    const QKEY = { IRS: 'RS', ITS: 'TS', IRH: 'RH', ITH: 'TH' };
    const invRow = (key, label, field) => `
      <div class="invrow" data-key="${key}">
        <div class="lbl">${label}<b>${field}</b><span class="upkeep num">upkeep ${money(maintInvest(u[QKEY[key]], P))}</span></div>
        <input type="range" min="0" max="${Math.ceil(budget)}" step="0.5" value="0">
        <div class="out"><b class="num amt">${money(0)}</b><span class="proj num"></span></div>
      </div>`;

    setView(`
      ${masthead('Published every autumn by The Morning Ledger', true)}
      ${dateline()}
      ${phaseStrip(2)}
      <div class="cols even">
        <div class="stack">
          <section class="card plain">
            <div class="card-head"><span>The year&rsquo;s admissions</span><span class="kicker">confidential</span></div>
            <div class="card-body">
              <div class="scrollx"><table class="report">
                <thead><tr><th>Field</th><th>${inScheme() ? 'Proposals' : 'Applied'}</th><th>${inScheme() ? 'Seats' : 'Offers'}</th><th>${inScheme() ? 'Placed' : 'Enrolled'}</th><th>Avg</th><th>Fees</th><th>${inScheme() ? 'Seats bill' : 'Overage'}</th></tr></thead>
                <tbody>
                  ${reportRow('S')}${reportRow('H')}
                  <tr class="sumrow"><td>Net of ${inScheme() ? 'the seats bill' : 'overage'}</td><td colspan="5"></td><td class="num ${rep.F - rep.C < 0 ? 'red' : 'green'}">${money(rep.F - rep.C)}</td></tr>
                </tbody>
              </table></div>
              <div class="notice">${intakeRemark()}</div>
            </div>
          </section>
        </div>
        <div class="stack">
          <section class="card bursar">
            <div class="card-head"><span>Step II &mdash; The Bursar&rsquo;s Office</span><span class="kicker">investment</span></div>
            <div class="card-body">
              <div class="budgetline decomp"><span>Endowment ${money(rep.net - rep.F + rep.C)} + the year&rsquo;s fees ${money(rep.F)}${rep.C > 0 ? ` &minus; ${inScheme() ? 'seats bill' : 'overage'} ${money(rep.C)}` : ''} = funds at hand</span><b class="num">${money(budget)}</b></div>
              <div class="budgetline" style="border-top:1px dotted var(--rule)"><span>Uncommitted (earns ${Math.round(P.interest * 100)}%, fees included)</span><b class="num" id="remain">${money(budget)}</b></div>
              ${invRow('IRS', 'Research', 'STEM')}
              ${invRow('ITS', 'Teaching', 'STEM', true)}
              ${invRow('IRH', 'Research', 'HSS')}
              ${invRow('ITH', 'Teaching', 'HSS', true)}
              <div class="presets">
                <button class="btn-ghost" id="pMaintain">Maintain all</button>
                <button class="btn-ghost" id="pEven">Even split, all in</button>
                <button class="btn-ghost" id="pClear">Clear</button>
              </div>
              <div class="notice">Investment bears fruit next year, with diminishing returns; quality decays ${Math.round((1 - P.delta) * 100)}% a year unattended. Teaching also moves with intake calibre (this year&rsquo;s average vs the national ${P.sMean}).</div>
              <button class="btn navy" id="commit">Commit the year&rsquo;s spending</button>
            </div>
          </section>
        </div>
      </div>
      <div class="footer-note">Printed under licence &numero; ${game.seed} &middot; The Morning Ledger University Guide</div>
    `);

    const project = (key, I) => {
      const q = u[QKEY[key]];
      let next = P.delta * q + g(I);
      if (key === 'ITS' && rep.S.matric > 0) next += P.kappa * (rep.S.sbar - P.sMean);
      if (key === 'ITH' && rep.H.matric > 0) next += P.kappa * (rep.H.sbar - P.sMean);
      return Math.max(0, next);
    };
    const refresh = () => {
      let total = 0;
      els('.invrow').forEach(row => { total += parseFloat(row.querySelector('input').value) || 0; });
      els('.invrow').forEach(row => {
        const key = row.dataset.key;
        const input = row.querySelector('input');
        let v = parseFloat(input.value) || 0;
        if (total > budget) { v = Math.max(0, v - (total - budget)); input.value = v; total = null; }
        inv[key] = v;
        row.querySelector('.amt').textContent = money(v);
        const q = u[QKEY[key]];
        const next = project(key, v);
        const proj = row.querySelector('.proj');
        proj.textContent = `${n1(q)} → ${n1(next)}`;
        proj.classList.toggle('up', next >= q);
        proj.classList.toggle('down', next < q);
      });
      if (total === null) { total = 0; els('.invrow input').forEach(i => total += parseFloat(i.value) || 0); }
      el('#remain').textContent = money(Math.max(0, budget - total));
    };
    els('.invrow input').forEach(i => i.addEventListener('input', refresh));
    el('#pMaintain').addEventListener('click', () => {
      let left = budget;
      for (const key of ['IRS', 'ITS', 'IRH', 'ITH']) {
        const want = Math.min(left, maintInvest(u[QKEY[key]], P));
        el(`.invrow[data-key=${key}] input`).value = Math.round(want * 2) / 2;
        left -= want;
      }
      refresh();
    });
    el('#pEven').addEventListener('click', () => {
      els('.invrow input').forEach(i => { i.value = Math.floor(budget / 4 * 2) / 2; });
      refresh();
    });
    el('#pClear').addEventListener('click', () => { els('.invrow input').forEach(i => { i.value = 0; }); refresh(); });
    el('#commit').addEventListener('click', () => {
      // Snapshot before the engine applies decay/investment/intake, so the
      // review can show old -> new with an exact decomposition.
      const uu = game.unis[game.playerIndex];
      const oldQ = { RS: uu.RS, TS: uu.TS, RH: uu.RH, TH: uu.TH };
      const res = game.submitSpend(inv);
      prevRanks = {};
      pre.table.forEach(r => { prevRanks[r.index] = r.rank; });
      renderReview(oldQ, res);
    });
    el('#resign').addEventListener('click', resign);
    refresh();
  }

  /* --------------------------- year in review -------------------------- */
  function renderReview(oldQ, res) {
    const u = game.unis[game.playerIndex];
    const invA = u._lastInv; // investment as actually applied by the engine
    const done = !!(res && res.done);
    const newTable = done ? res.finalTable : game.leagueTable();
    const myOldRank = pre.table.find(r => r.index === game.playerIndex).rank;
    const myNewRank = newTable.find(r => r.index === game.playerIndex).rank;

    const ROWS = [
      ['RS', 'IRS', 'Research &middot; STEM', null],
      ['TS', 'ITS', 'Teaching &middot; STEM', 'S'],
      ['RH', 'IRH', 'Research &middot; HSS', null],
      ['TH', 'ITH', 'Teaching &middot; HSS', 'H'],
    ];
    const rows = ROWS.map(([q, ik, label, fld]) => {
      const oldV = oldQ[q], newV = u[q];
      const decay = -(1 - P.delta) * oldV;
      const invGain = g(invA[ik]);
      const parts = [`decay &minus;${n1(-decay)}`, `investment +${n1(invGain)}`];
      let intake = 0;
      if (fld && rep[fld].matric > 0) {
        intake = P.kappa * (rep[fld].sbar - P.sMean);
        parts.push(`intake ${intake < 0 ? '&minus;' : '+'}${n1(Math.abs(intake))}`);
      }
      if (Math.abs(oldV + decay + invGain + intake - newV) > 1e-6) parts.push('(floored at nought)');
      return `<tr>
        <td>${label}<span class="dcomp">${parts.join(' &middot; ')}</span></td>
        <td class="num">${n1(oldV)}</td><td>&rarr;</td>
        <td class="num ${newV >= oldV ? 'green' : 'red'}"><b>${n1(newV)}</b></td>
      </tr>`;
    }).join('');

    // Money prose (all from the player's own books).
    const spent = invA.IRS + invA.ITS + invA.IRH + invA.ITH;
    const interest = u.E - (rep.net - spent);
    // Opening balance = endowment at the admissions desk (already including
    // any of the morning's money news). opening + F - C - I + interest = E.
    const opening = rep.net - rep.F + rep.C;
    const hadMoneyNews = (pre.events || []).some(e => e.index === game.playerIndex && e.deltaE !== undefined);
    const moneyProse = `The College opened the year with ${money(opening)}; fees brought ${money(rep.F)}${rep.C > 0 ? `, ${inScheme() ? 'the seats bill took' : 'overage took'} ${money(rep.C)}` : ''}; the Bursar committed ${money(spent)}, and interest added ${money(Math.max(0, interest))}. The endowment stands at <b class="num">${money(u.E)}</b>.${hadMoneyNews ? ' The opening figure includes the year&rsquo;s news.' : ''}`;

    // Rank prose, with variants; name rivals passed or passing.
    const newRankOf = i => newTable.find(r => r.index === i).rank;
    const oldRankOf = i => pre.table.find(r => r.index === i).rank;
    const rivals = game.unis.filter(x => x.index !== game.playerIndex);
    const overtaken = rivals.filter(x => oldRankOf(x.index) < myOldRank && newRankOf(x.index) > myNewRank);
    const overtakers = rivals.filter(x => oldRankOf(x.index) > myOldRank && newRankOf(x.index) < myNewRank);
    let rankProse;
    if (myNewRank < myOldRank) {
      rankProse = myNewRank === 1
        ? pick([
            'First. The Ledger&rsquo;s position is that it saw promise all along, and its archives are unavailable.',
            'First of the League. Somewhere in the Ledger&rsquo;s offices, a wager is quietly being settled.',
          ])
        : pick([
            `The College rises to ${ord(myNewRank)}. The Ledger has checked its arithmetic twice.`,
            `Up to ${ord(myNewRank)}. The Ledger prints the fact and withholds the adjective.`,
          ]);
      if (overtaken.length) rankProse += ` ${overtaken.map(x => esc(x.name)).join(' and ')} has been passed, and describes the year as &lsquo;transitional&rsquo;.`;
    } else if (myNewRank > myOldRank) {
      rankProse = pick([
        `The College slips to ${ord(myNewRank)}. The Ledger resists satisfaction, briefly.`,
        `Down to ${ord(myNewRank)}. The Ledger&rsquo;s sympathy is sincere, and brief.`,
      ]);
      if (overtakers.length) rankProse += ` ${overtakers.map(x => esc(x.name)).join(' and ')} passes the College, and mentions it.`;
    } else {
      rankProse = pick([
        'The table is unmoved. The Ledger admires consistency, within reason.',
        'No movement in the League. The porter says it could be worse, and the porter is right.',
      ]);
    }

    setView(`
      ${masthead('Published every autumn by The Morning Ledger', true)}
      ${dateline()}
      ${phaseStrip(3)}
      <div class="cols even">
        <div class="stack">
          <section class="card plain">
            <div class="card-head"><span>Step III &mdash; The Year in Review</span><span class="kicker">Year ${game.round}</span></div>
            <div class="card-body">
              <div class="scrollx"><table class="report">
                <thead><tr><th>Quality</th><th>was</th><th></th><th>now</th></tr></thead>
                <tbody>${rows}</tbody>
              </table></div>
            </div>
          </section>
        </div>
        <div class="stack">
          <section class="card plain">
            <div class="card-head"><span>The Ledger&rsquo;s summary</span><span class="kicker">leader column</span></div>
            <div class="card-body">
              <p class="notice" style="margin-top:0">${moneyProse}</p>
              <p class="notice">${rankProse}</p>
              <button class="btn" id="proceed">${done ? 'Read the final edition' : `Proceed to Year ${game.round + 1}`}</button>
            </div>
          </section>
        </div>
      </div>
      <div class="footer-note">Printed under licence &numero; ${game.seed} &middot; The Morning Ledger University Guide</div>
    `);
    el('#proceed').addEventListener('click', () => {
      if (done) renderEnd({ finalTable: res.finalTable });
      else nextYear();
    });
    el('#resign').addEventListener('click', resign);
  }

  function intakeRemark() {
    const bits = [];
    for (const f of ['S', 'H']) {
      const d = rep[f];
      if (d.matric === 0) bits.push(`${FIELD_SHORT[f]} admitted nobody &mdash; no fees, and no effect on teaching either way`);
      else if (d.sbar >= P.sMean + 5) bits.push(`${FIELD_SHORT[f]}&rsquo;s intake (avg ${n1(d.sbar)}) flatters its teaching`);
      else if (d.sbar <= P.sMean - 5) bits.push(`${FIELD_SHORT[f]}&rsquo;s intake (avg ${n1(d.sbar)}) drags teaching by ${n1(P.kappa * (P.sMean - d.sbar))} a year at current calibre`);
    }
    // Scheme: empty declared seats are the ailment (the match never
    // declines an offer — it simply seats students elsewhere).
    if (inScheme()) {
      const empty = ['S', 'H'].filter(f => rep[f].offers >= 4 && rep[f].matric < rep[f].offers / 2);
      if (empty.length) {
        const names = empty.map(f => FIELD_SHORT[f]).join(' and ');
        bits.push(pick([
          `Over half of ${names}&rsquo;s declared seats stood empty &mdash; the algorithm consulted the applicants, and the applicants had other ideas`,
          `${names} declared seats the match did not fill; the Regulator&rsquo;s rent, the Ledger notes, applies to ambition as well as to students`,
        ]));
      }
      return bits.length ? bits.join('; ') + '.' : 'A quiet year for the registry: intake near the national average.';
    }
    // Declined-offers feedback. Uses only the player's own report and the
    // public league table: if some rival's teaching AND research in the
    // field both match or beat ours, the Ledger names the ailment.
    const me = game.unis[game.playerIndex];
    const declined = ['S', 'H'].filter(f => rep[f].offers >= 5 && rep[f].matric < rep[f].offers / 2);
    if (declined.length) {
      const dominated = declined.some(f => pre.table.some(r =>
        r.index !== game.playerIndex && !r.broke &&
        (f === 'S' ? (r.TS >= me.TS && r.RS >= me.RS) : (r.TH >= me.TH && r.RH >= me.RH))));
      const names = declined.map(f => FIELD_SHORT[f]).join('&rsquo;s and ');
      const opener = pick([
        `Most of ${names}&rsquo;s offers were taken up elsewhere`,
        `${names}&rsquo;s offers were, in the main, politely declined`,
      ]);
      bits.push(opener + (dominated
        ? pick([
            ` &mdash; the Ledger observes that ${esc(me.name)} is at present neither the cheapest house nor the best at anything`,
            ` &mdash; a rival, the Ledger notes, currently bests ${esc(me.name)} in both teaching and research there, and the applicants have noticed`,
          ])
        : pick([
            `; applicants with choices exercised them`,
            ` &mdash; the applicants, having choices, chose`,
          ])));
    }
    return bits.length ? bits.join('; ') + '.' : 'A quiet year for the registry: intake near the national average.';
  }

  /* ---------------------------- end screens ---------------------------- */
  function resign() {
    if (!game || game.phase === 'over') return;
    if (!confirm('Resign the post and let the Ledger print what it will?')) return;
    game.finalRank = game.rankOf(game.playerIndex);
    game.score = game.initialRank - game.finalRank;
    if (game.rankHistory[game.rankHistory.length - 1] !== game.finalRank) game.rankHistory.push(game.finalRank);
    renderEnd({ resigned: true });
  }

  function rankChart() {
    const H = game.rankHistory;
    const W = 620, HT = 220, padL = 46, padR = 16, padT = 18, padB = 34;
    const iw = W - padL - padR, ih = HT - padT - padB;
    const x = i => padL + (H.length === 1 ? 0 : iw * i / (H.length - 1));
    const y = r => padT + ih * (r - 1) / 3;
    const pts = H.map((r, i) => `${x(i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
    const grid = [1, 2, 3, 4].map(r =>
      `<line x1="${padL}" y1="${y(r)}" x2="${W - padR}" y2="${y(r)}" stroke="#cfc3a8" stroke-dasharray="3 4"/>
       <text x="${padL - 10}" y="${y(r) + 4}" text-anchor="end" font-size="12" fill="#6f6553">${r}${['st', 'nd', 'rd', 'th'][r - 1]}</text>`).join('');
    const xticks = H.map((r, i) => i).filter(i => i % Math.ceil(H.length / 10) === 0 || i === H.length - 1)
      .map(i => `<text x="${x(i)}" y="${HT - 12}" text-anchor="middle" font-size="11" fill="#6f6553">${i === 0 ? 'start' : i}</text>`).join('');
    const dots = H.map((r, i) => `<circle cx="${x(i)}" cy="${y(r)}" r="3.2" fill="#7c2a1e"/>`).join('');
    return `<svg viewBox="0 0 ${W} ${HT}" role="img" aria-label="League position by year">
      <rect x="0" y="0" width="${W}" height="${HT}" fill="none"/>
      ${grid}${xticks}
      <polyline points="${pts}" fill="none" stroke="#7c2a1e" stroke-width="2.5"/>
      ${dots}
      <text x="${(padL + W - padR) / 2}" y="${HT - 0.5}" text-anchor="middle" font-size="11" fill="#6f6553">academic year</text>
    </svg>`;
  }

  function renderEnd(o) {
    const u = game.unis[game.playerIndex];
    const score = game.score;
    let verdict, headline, body;
    if (o.bankrupt) {
      verdict = 'The Ledger regrets to report';
      headline = `${esc(u.name)} is bankrupt`;
      body = `The overage bill could not be met, the doors are chained, and the porters have kept the good chairs. Year ${game.round} of ${P.rounds}.`;
    } else if (o.resigned) {
      verdict = 'From the appointments column';
      headline = 'A resignation at ' + esc(u.name);
      body = `The Vice-Chancellor departs &ldquo;to pursue other interests&rdquo; after ${game.round} year${game.round === 1 ? '' : 's'}.`;
    } else if (score >= 3) {
      verdict = 'The Ledger eats its words';
      headline = `${esc(u.name)}, first of the League`;
      body = 'From the foot of the table to the top of it. This newspaper maintains, without embarrassment, that it saw promise all along.';
    } else if (score >= 1) {
      verdict = 'The Ledger concedes';
      headline = `${esc(u.name)} on the rise`;
      body = 'A creditable ascent, if not yet the summit. The senior common room permits itself one glass of the good sherry.';
    } else if (score === 0) {
      verdict = 'The Ledger observes';
      headline = 'The natural order holds';
      body = 'Twenty years of administration, and the table stands exactly as it did. There is a certain dignity in that. A very small one.';
    } else {
      verdict = 'The Ledger is not surprised';
      headline = `${esc(u.name)} slips`;
      body = 'The governing board thanks the outgoing Vice-Chancellor for their service and asks that the key be left with the porter.';
    }
    const finalTable = o.finalTable || game.leagueTable();
    prevRanks = null;
    setView(`
      ${masthead('The final edition')}
      <section class="card plain">
        <div class="card-body endcard">
          <div class="verdict">${verdict}</div>
          <h2>${headline}</h2>
          <p style="max-width:560px;margin:0 auto">${body}</p>
          <div class="scoreline">Score: <b class="num">${score >= 0 ? score : score}</b> <span style="color:var(--faint)">(started ${game.initialRank}${['st', 'nd', 'rd', 'th'][game.initialRank - 1]}, finished ${game.finalRank}${['st', 'nd', 'rd', 'th'][game.finalRank - 1]})</span></div>
          <div class="chartwrap">${rankChart()}</div>
          <div class="chart-caption">League position of ${esc(u.name)}, by year. The top line is the top of the League.</div>
        </div>
      </section>
      <div style="margin-top:18px">
        <section class="card plain">
          <div class="card-head"><span>The final League</span><span class="kicker">as printed</span></div>
          <div class="card-body">${leagueTableHtml(finalTable)}</div>
        </section>
      </div>
      <button class="btn" id="again" style="max-width:340px;display:block;margin:22px auto 0">Another twenty years</button>
      <div class="footer-note">Printed under licence &numero; ${game.seed} &middot; The Morning Ledger University Guide</div>
    `);
    el('#again').addEventListener('click', renderTitle);
  }

  renderTitle();
})();

</script>
</body>
</html>
